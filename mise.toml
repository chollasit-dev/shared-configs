#:schema https://mise.en.dev/schema/mise.json

[vars]
root = "shared-configs"
mise_conf = "config.toml"
miserc_conf = "miserc.local.toml"

[tasks.stow]
run = """
ln -sf {{ env.HOME }}/{{ vars.root }}/.config/mise/{{ vars.mise_conf }} {{ env.HOME }}/.config/mise/{{ vars.mise_conf }}
ln -sf {{ env.HOME }}/{{ vars.root }}/.config/mise/{{ vars.miserc_conf }} {{ env.HOME }}/.config/mise/{{ vars.miserc_conf }}
"""
