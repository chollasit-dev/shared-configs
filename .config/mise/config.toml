#:schema https://mise.en.dev/schema/mise.json

[tools]
apollo-rover = "latest"
bat = "latest"
btop = "latest"
caddy = "latest"
carapace = "latest"
claude = "latest"
cloc = "latest"
codex = "latest"
fd = "latest"
fzf = "latest"
gallery-dl = "latest"
ghcup = "latest"
github-cli = "latest"
glow = "latest"
golangci-lint = "latest"
gron = "latest"
imagemagick = "latest"
jq = "latest"
jqp = "latest"
lazyssh = "latest"
lsd = "latest"
lua = "latest"
mongosh = "latest"
neovim = "latest"
node = "lts"
opencode = "latest"
pnpm = "latest"
poppler = "latest"
rclone = "latest"
resvg = "latest"
ripgrep = "latest"
rust = "latest"
starship = "latest"
tmux = "latest"
tree-sitter = "latest"
usage = "latest"
watchexec = "latest"
yarn = "latest"
yazi = "latest"
yq = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
zoxide = "latest"

# Go bin that should be installed via local Go toolchain
"go:github.com/melkeydev/go-blueprint" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:golang.org/x/pkgsite/cmd/internal/pkgsite-cli" = "latest"
uv = "latest"
go = "latest"
workmux = "latest"

[env]
MISE_COLOR_THEME = "catppuccin"
OLLAMA_CONTEXT_LENGTH = "65536"

[bootstrap.repos]
"~/shared-configs" = { url = "git@github.com:chollasit-dev/shared-configs.git" }
"~/zsh-syntax-highlighting" = { url = "git@github.com:zsh-users/zsh-syntax-highlighting.git" }

[settings.dotfiles]
default_mode = "symlink"

[dotfiles]
"~/.agents" = { source = "~/shared-configs/.agents", mode = "copy" }
"~/.claude" = { source = "~/shared-configs/.agents", mode = "symlink-each" }
"~/.claude/settings.json" = { source = "~/shared-configs/.claude/settings.json" }
"~/.codex" = { source = "~/shared-configs/.codex", mode = "symlink-each" }
"~/.config" = { source = "~/shared-configs/.config", mode = "symlink-each" }
"~/.local" = { source = "~/shared-configs/.local", mode = "symlink-each" }
"~/.oh-my-zsh" = { source = "~/shared-configs/.oh-my-zsh", mode = "symlink-each" }
"~/init" = { source = "~/shared-configs/init" }
"~/scripts/rc" = { source = "~/shared-configs/scripts/rc", mode = "symlink-each" }
"~/.gitattributes" = { source = "~/shared-configs/.gitattributes" }
"~/.gitconfig" = { source = "~/shared-configs/.gitconfig" }
"~/.prettierrc" = { source = "~/shared-configs/.prettierrc" }
"~/.sqliterc" = { source = "~/shared-configs/.sqliterc" }
"~/.vimrc" = { source = "~/shared-configs/.vimrc" }
"~/.zshenv" = { source = "~/shared-configs/.zshenv" }
"~/.zshrc" = { source = "~/shared-configs/.zshrc" }
"~/package.json" = { source = "~/shared-configs/package.json" }
